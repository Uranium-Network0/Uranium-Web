<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URANIUM NETWORK // Under Construction</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0e120c;
    --bg-panel: #171d12;
    --rust: #3c7d1f;
    --rust-bright: #6fbf2a;
    --olive: #4d5c1e;
    --sand: #c9d1a8;
    --bone: #eef0dc;
    --amber: #d4c93a;
    --line: #2c3620;
    --danger: #c22a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(111, 191, 42, 0.08), transparent 60%),
      var(--bg);
    color: var(--bone);
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scanline Overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 1000;
  }

  /* Top Hazard Border */
  .hazard-edge {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(135deg, var(--amber) 0 14px, #14171a 14px 28px);
    opacity: 0.9;
    z-index: 1001;
  }

  /* Header / Nav */
  header {
    position: relative;
    z-index: 500;
    background: rgba(22, 21, 15, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .logo {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
  }

  .logo span { color: var(--rust-bright); }

  .navlinks { display: flex; gap: 34px; }

  .navlinks a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sand);
    text-decoration: none;
    position: relative;
    padding-bottom: 4px;
    transition: color .2s ease;
  }

  .navlinks a:hover { color: var(--bone); }

  .navlinks a::after {
    content: ""; position: absolute; left: 0; bottom: 0; width: 0; height: 1px;
    background: var(--rust-bright); transition: width .2s ease;
  }

  .navlinks a:hover::after { width: 100%; }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 2px solid var(--sand);
    background: transparent;
    color: var(--sand);
    text-decoration: none;
    cursor: pointer;
    clip-path: polygon(0 0, 100% 0, 100% 70%, 94% 100%, 0 100%);
    transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
  }

  .btn-ghost:hover {
    background: rgba(233, 226, 205, 0.08);
    border-color: var(--bone);
    color: var(--bone);
  }

  /* Main Viewport Container */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  /* Tactical Card */
  .wip-card {
    position: relative;
    width: 100%;
    max-width: 560px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 44px 40px 34px;
    margin: 0 auto;
  }

  .wip-card .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid var(--rust-bright);
  }

  .wip-card .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .wip-card .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .wip-card .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .wip-card .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .wip-eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--sand);
    margin-bottom: 18px;
  }

  .wip-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--rust-bright);
    box-shadow: 0 0 8px var(--rust-bright), 0 0 2px var(--rust-bright);
    animation: wip-pulse 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes wip-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .wip-card h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: 0.5px;
    margin: 0 0 12px;
    color: var(--bone);
  }

  .wip-card h1 span {
    color: var(--rust-bright);
  }

  .wip-card p.lede {
    font-size: 16px;
    color: var(--sand);
    line-height: 1.5;
    margin: 0 0 30px;
  }

  .wip-progress-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--sand);
    margin-bottom: 8px;
  }

  .wip-pct {
    color: var(--rust-bright);
    font-weight: 700;
  }

  .wip-bar-track {
    position: relative;
    height: 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .wip-bar-fill {
    position: relative;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--rust), var(--rust-bright));
    box-shadow: 0 0 10px rgba(111, 191, 42, 0.4);
    transition: width 1.4s cubic-bezier(.4, 0, .2, 1);
  }

  .wip-bar-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.25) 0 8px, transparent 8px 16px);
    animation: wip-march 1s linear infinite;
  }

  @keyframes wip-march {
    from { background-position: 0 0; }
    to { background-position: 22px 0; }
  }

  .wip-ticker-line {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--sand);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .wip-ticker-line b {
    color: var(--amber);
  }

  /* Footer */
  footer {
    padding: 24px 0;
    border-top: 1px solid var(--line);
    background: var(--bg-panel);
  }

  footer .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }

  footer .fmono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--sand);
    letter-spacing: 0.05em;
  }

  footer a { color: inherit; text-decoration: none; }

  @media (max-width: 760px) {
    .navlinks { display: none; }
  }

  @media (max-width: 480px) {
    .wip-card h1 { font-size: 26px; }
    .wip-card { padding: 32px 22px 26px; }
  }
</style>
</head>
<body>

<div class="hazard-edge"></div>

<header>
  <nav>
    <div class="logo">URANIUM<span>NETWORK</span></div>
    <div class="navlinks">
      <a href="home.html">Home</a>
      <a href="rules.html">Rules</a>
      <a href="java.html">Java</a>
      <a href="bedrock.html">???</a>
    </div>
    <a class="btn-ghost" href="https://discord.gg/tf7jtqgWJr" target="_blank" rel="noopener">Discord</a>
  </nav>
</header>

<main>
  <div class="wip-card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="wip-eyebrow">
      <span class="wip-dot"></span> Status // Building the base
    </div>

    <h1>Under<br>construction<span>.</span></h1>
    <p class="lede">This part of the network isn't live yet. Check back soon.</p>

    <div class="wip-progress-head">
      <span>Deployment progress</span>
      <span class="wip-pct" id="wipPct">0%</span>
    </div>
    
    <div class="wip-bar-track">
      <div class="wip-bar-fill" id="wipBar"></div>
    </div>

    <div class="wip-ticker-line">
      <span>ETA: UNKNOWN™</span>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="fmono">Uranium Network © 2026 — All rights reserved</div>
    <div class="fmono"><a href="https://discord.gg/tf7jtqgWJr" target="_blank" rel="noopener">discord.gg/tf7jtqgWJr</a></div>
  </div>
</footer>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const target = 12; // Adjust target progress percentage here
    const bar = document.getElementById('wipBar');
    const pct = document.getElementById('wipPct');

    if (bar && pct) {
      requestAnimationFrame(() => {
        bar.style.width = target + '%';
      });

      let current = 0;
      const step = () => {
        if (current < target) {
          current++;
          pct.textContent = current + '%';
          setTimeout(step, 1400 / target);
        } else {
          pct.textContent = target + '%';
        }
      };
      step();
    }
  });
</script>

</body>
</html>
